# Honour an upstream TLS terminator (cloud VSaaS behind a load balancer),
# otherwise fall back to the scheme nginx itself received.
map $http_x_forwarded_proto $fwd_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the Django backend (ASGI).
    # $http_host (not $host) keeps the :8080 port so Django builds correct
    # absolute URLs for media/snapshots.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    # Proxy Django admin + static + media (event snapshots, plates, maps)
    location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; }
    location /static/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; }
    location /media/ { proxy_pass http://backend:8000; proxy_set_header Host $http_host; }

    # WebSocket (Channels) for live events
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # ---- Live video through the SAME origin as the app ----
    # This is what makes one build work in every deployment mode:
    #   local    http://localhost:8080/webrtc/cam_1/whep
    #   LAN VMS  http://192.168.1.50:8080/webrtc/cam_1/whep
    #   cloud    https://vms.example.com/webrtc/cam_1/whep
    # The browser never needs to reach MediaMTX's ports directly, so no
    # hardcoded host, no extra firewall rules, and HTTPS works out of the box.

    # WebRTC signalling (WHEP: POST an SDP offer, get an SDP answer)
    location /webrtc/ {
        proxy_pass http://mediamtx:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # MediaMTX redirects relative to its own root and doesn't know it lives
        # under /webrtc. Rebuild the Location with the client's own scheme+host
        # (keeps the :8080 port on LAN, and https:// behind a cloud LB).
        proxy_redirect / $fwd_scheme://$http_host/webrtc/;
    }

    # HLS fallback (works through any proxy/NAT — pure TCP)
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # MediaMTX's HLS sets a cookie then 302s to "/<path>/index.m3u8",
        # dropping the /hls prefix. Without this rewrite the browser follows it
        # into the SPA and gets index.html instead of a playlist. Rebuilding the
        # Location from the client's scheme+host preserves the port (:8080) and
        # yields https:// when a cloud load balancer terminates TLS.
        proxy_redirect / $fwd_scheme://$http_host/hls/;
        proxy_cookie_path / /hls/;
        add_header Cache-Control no-cache always;
    }
}
